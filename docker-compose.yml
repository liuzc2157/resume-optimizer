# 本地一键部署：后端 + MySQL（含示例 JD 种子数据）
#
# 说明：你本机已有一个 MySQL 跑在 3306，为避免端口冲突，
# 这里把容器 MySQL 映射到宿主机的 3307。后端在容器内通过服务名 mysql:3306 访问。
# 若只想接你已有的本地 MySQL，可直接 `docker compose up backend` 并改 backend 的 DB_HOST=host.docker.internal。
#
# 用法：
#   cp deploy/.env.compose.example .env   # 填入 DB_PASSWORD / GLM_API_KEY
#   docker compose up -d
#   # 后端 http://localhost:8000  文档 /docs

services:
  mysql:
    image: mysql:8.0
    container_name: ropt-mysql
    command: --default-authentication-plugin=caching_sha2_password
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-rootpass}
      MYSQL_DATABASE: resume_optimizer
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"
    volumes:
      # 首次启动自动建库建表 + 写入示例 JD
      - ./deploy/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-rootpass}"]
      interval: 5s
      timeout: 5s
      retries: 15

  backend:
    build: .
    container_name: ropt-backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-rootpass}
      DB_NAME: resume_optimizer
      LLM_PROVIDER: ${LLM_PROVIDER:-glm}
      GLM_API_KEY: ${GLM_API_KEY}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-}
    ports:
      - "8000:8000"

volumes:
  mysql_data:
